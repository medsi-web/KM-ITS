# Local MongoDB for development. Next.js runs on the host with `pnpm dev`.
# Single-node replica set: backend auth and Archive ingestion need transactions.
# Port is bound to loopback only; this development database has no password.
name: kmits

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once
      # this node is PRIMARY. The member host is "mongo:27017"; clients on the
      # host connect with directConnection=true so they never resolve it.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
